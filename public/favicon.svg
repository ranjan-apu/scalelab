<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="ScaleLab"
>
  <title>ScaleLab</title>
  <defs>
    <linearGradient id="sl-top" x1="8" y1="6" x2="24" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sl-left" x1="5" y1="14" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="sl-right" x1="16" y1="14" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Ground tile -->
  <rect width="32" height="32" rx="7.5" fill="#0D131F" />
  <rect width="32" height="32" rx="7.5" stroke="#1E293B" stroke-width="0.75" />

  <!-- Isometric System Node / Hex-Prism -->
  <!-- Top Face (Ingress / Control Plane) -->
  <path d="M16 6 L25.5 11.5 L16 17 L6.5 11.5 Z" fill="url(#sl-top)" />

  <!-- Left Face (Distributed Compute / Services) -->
  <path d="M6.5 11.5 L16 17 V27 L6.5 21.5 Z" fill="url(#sl-left)" />

  <!-- Right Face (Storage / Persistent Queues) -->
  <path d="M16 17 L25.5 11.5 V21.5 L16 27 Z" fill="url(#sl-right)" />

  <!-- Micro Topology Conduit & Flow Vectors -->
  <path d="M16 8.5 L22 12 L16 15 L10 12 Z" stroke="#93C5FD" stroke-opacity="0.6" stroke-width="0.8" fill="none" />
  <path d="M16 17 V25" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  <path d="M10 13.5 L16 17 L22 13.5" stroke="#60A5FA" stroke-width="0.8" stroke-linecap="round" fill="none" />

  <!-- Active Event Hub / Pulse Nucleus -->
  <circle cx="16" cy="17" r="2.2" fill="#38BDF8" />
  <circle cx="16" cy="17" r="1" fill="#FFFFFF" />
</svg>
