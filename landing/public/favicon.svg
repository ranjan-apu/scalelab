<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="ScaleLab"
>
  <title>ScaleLab</title>
  <defs>
    <linearGradient id="sl-grad-core" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="sl-grad-accent" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="sl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ground tile -->
  <rect width="32" height="32" rx="8" fill="#090D16" />
  <rect width="32" height="32" rx="8" stroke="#1E293B" stroke-width="1" fill="none" />

  <!-- Studio Lab Mark: Interlocking Distributed Nodes & Scaled Signal -->
  <g filter="url(#sl-glow)">
    <!-- Node A (Top-Left Ingress Node) -->
    <rect x="6.5" y="7" width="8" height="8" rx="2.5" fill="url(#sl-grad-accent)" />
    <!-- Node B (Bottom-Right Replicated Node) -->
    <rect x="17.5" y="17" width="8" height="8" rx="2.5" fill="url(#sl-grad-core)" />
    
    <!-- Distributed Data Bus Conduits -->
    <path d="M14.5 11 H19.5 C20.6 11 21.5 11.9 21.5 13 V17" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M17.5 21 H12.5 C11.4 21 10.5 20.1 10.5 19 V15" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Center Pulse Core (The Simulation Lab Hub) -->
    <circle cx="16" cy="16" r="3" fill="#090D16" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="16" cy="16" r="1.3" fill="#FFFFFF" />
  </g>
</svg>
